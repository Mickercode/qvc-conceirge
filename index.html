    <style>
      @layer base {
        html, body {
          margin: 0;
          padding: 0;
        }
        body {
          overscroll-behavior: none;
        }
        main > :first-child {
          margin-top: 0 !important;
        }
        main > :last-child {
          margin-bottom: 0 !important;
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
      /* 3D Motion & Card Depth styles */
      .perspective-container {
        perspective: 1200px;
      }
      @keyframes subtleFloat1 {
        0%, 100% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
        50% { transform: translateY(-7px) rotateX(1.2deg) rotateY(-1deg); }
      }
      @keyframes subtleFloat2 {
        0%, 100% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
        50% { transform: translateY(-9px) rotateX(-1deg) rotateY(1.3deg); }
      }
      @keyframes subtleFloat3 {
        0%, 100% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
        50% { transform: translateY(-6px) rotateX(1.4deg) rotateY(1deg); }
      }
      @keyframes subtleFloat4 {
        0%, 100% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
        50% { transform: translateY(-8px) rotateX(-1.2deg) rotateY(-1.2deg); }
      }
      @keyframes subtleFloat5 {
        0%, 100% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
        50% { transform: translateY(-10px) rotateX(1.3deg) rotateY(-0.8deg); }
      }
      .animate-float-1 { animation: subtleFloat1 7s ease-in-out infinite; }
      .animate-float-2 { animation: subtleFloat2 8.5s ease-in-out infinite 0.8s; }
      .animate-float-3 { animation: subtleFloat3 7.8s ease-in-out infinite 1.6s; }
      .animate-float-4 { animation: subtleFloat4 8.2s ease-in-out infinite 2.2s; }
      .animate-float-5 { animation: subtleFloat5 9s ease-in-out infinite 1.2s; }

      /* Interactive Spotlight & Dimming for Siblings */
      .cards-cluster:hover .interactive-service-card:not(:hover) {
        opacity: 0.8;
        transform: scale(0.99);
      }
      .interactive-service-card {
        transform-style: preserve-3d;
        will-change: transform, box-shadow;
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, opacity 0.35s ease;
      }
      .interactive-service-card:hover {
        opacity: 1 !important;
        filter: none !important;
        box-shadow: 0 25px 50px -12px rgba(0, 89, 164, 0.16), 0 12px 24px -8px rgba(15, 23, 42, 0.12);
      }
      .interactive-service-card.is-active {
        border-color: #0072ce !important;
        box-shadow: 0 20px 45px -10px rgba(0, 89, 164, 0.18), 0 0 0 1px #0072ce !important;
      }

      /* Accordion Drawer Expansion */
      .service-expand-panel {
        transition: max-height 0.55s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), margin 0.4s ease;
      }

      @media (prefers-reduced-motion: reduce) {
        .animate-float-1, .animate-float-2, .animate-float-3, .animate-float-4, .animate-float-5 {
          animation: none !important;
        }
        .interactive-service-card, .service-expand-panel {
          transition: none !important;
        }
      }
    </style>
